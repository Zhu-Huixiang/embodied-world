 if(n.kind==='local'){const b=document.createElement('button');b.textContent='回到 '+by.get('paper:'+n.paper).title+' 星系';b.onclick=()=>choose('paper:'+n.paper);box.append(b);}
 for(const e of D.edges.filter(e=>(e.from===n.id||e.to===n.id)&&e.source_url)){const p=document.createElement('p'),a=document.createElement('a');p.className='muted';p.textContent=e.explanation+' ';a.textContent='原文依据';a.href=e.source_url;a.target='_blank';a.rel='noopener';p.append(a);box.append(p);}
}
function choose(id,fromList=false){selected=id;const n=by.get(id);if(n.kind==='paper'||n.kind==='concept'||!focus||!ids.has(id)){focus=n.kind==='local'?'paper:'+n.paper:id;refresh(true);}else refresh(false);detail(n);draw();if(fromList&&innerWidth<640)canvas.scrollIntoView({block:'center',behavior:reduced.matches?'instant':'smooth'});}
function fit(){const pts=visible.map(n=>positions.get(n.id));const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);const minX=Math.min(...xs,0),maxX=Math.max(...xs,0),minY=Math.min(...ys,0),maxY=Math.max(...ys,0);view.scale=Math.min((W-70)/Math.max(maxX-minX+90,120),(H-95)/Math.max(maxY-minY+90,120),1.25);view.x=-(minX+maxX)/2*view.scale;view.y=-(minY+maxY)/2*view.scale;}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);fit();draw();}
function screen(p){return{x:W/2+view.x+p.x*view.scale,y:H/2+view.y+p.y*view.scale};}
function draw(){if(!W)return;ctx.clearRect(0,0,W,H);const near=selected?new Set([selected,...neighbors(selected)]):null;const lines={shared:css('--planet'),uses:css('--planet'),cites:css('--planet')};
 for(const e of D.edges){if(!ids.has(e.from)||!ids.has(e.to))continue;if(e.kind==='shared'&&!focus&&!e.lit&&view.scale<.8)continue;const a=screen(positions.get(e.from)),b=screen(positions.get(e.to)),active=selected&&(e.from===selected||e.to===selected);ctx.strokeStyle=lines[e.kind]|| (e.lit?css('--star'):css('--dim'));ctx.globalAlpha=active?.52:focus?(e.lit?.3:.14):e.lit?.2:.045;ctx.lineWidth=active?1.15:.65;ctx.setLineDash(e.kind==='hierarchy'||e.kind==='shared'?[3,5]:e.kind==='uses'||e.kind==='cites'?[6,5]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}ctx.setLineDash([]);
 const labels=[];for(const n of visible){const p=screen(positions.get(n.id)),active=!near||near.has(n.id),r=n.kind==='paper'?(n.lit?5.5:3.6):n.kind==='concept'?3.2:2.8;if(p.x<0||p.y<0||p.x>W||p.y>H)continue;ctx.globalAlpha=focus?active?1:.5:n.lit?1:n.kind==='local'?.22:.62;
 if(n.lit){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);g.addColorStop(0,css('--glow'));g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*4,0,Math.PI*2);ctx.fill();}
 ctx.fillStyle=n.lit?(n.kind==='paper'?css('--star'):css('--planet')):css('--dim');ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();if(n.id===selected){ctx.strokeStyle=css('--ink');ctx.globalAlpha=1;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);ctx.stroke();}
 const show=n.id===selected||n.id===hover||(focus&&active)||(n.kind==='paper'&&n.lit)||(!focus&&n.kind==='concept'&&!n.parent)||(!focus&&view.scale>.9&&n.kind==='paper');if(show)labels.push({n,p,r,priority:n.id===hover?0:n.id===selected?1:n.kind==='paper'?2:n.lit?3:4});}
 labels.sort((a,b)=>a.priority-b.priority);const boxes=[];for(const {n,p,r,priority} of labels){ctx.font=`${priority<3?12:11}px -apple-system, sans-serif`;const title=short(n.title),w=ctx.measureText(title).width+10,h=19;let picked=null;for(const [dx,dy,align] of [[0,r+17,'center'],[0,-r-10,'center'],[r+8,4,'left'],[-r-8,4,'right']]){let x=p.x+dx,y=p.y+dy,left=align==='center'?x-w/2:align==='left'?x:x-w,box={x:left,y:y-h+4,w,h};if(box.x<7||box.x+w>W-7||box.y<38||box.y+h>H-48)continue;if(!boxes.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y)){picked={x,y,align,box};break;}}
 if(!picked)continue;boxes.push(picked.box);ctx.globalAlpha=1;ctx.fillStyle=css('--sky');ctx.fillRect(picked.box.x,picked.box.y,w,h);ctx.fillStyle=n.lit?css('--ink'):css('--muted');ctx.textAlign=picked.align;ctx.fillText(title,picked.x,picked.y);}
 ctx.globalAlpha=1;canvas.dataset.labels=String(boxes.length);
}
function hit(e){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,d=14;for(const n of visible){const p=screen(positions.get(n.id)),dist=Math.hypot(p.x-x,p.y-y);if(dist<d){d=dist;best=n;}}return best;}
function zoom(f){view.scale=Math.max(.12,Math.min(3,view.scale*f));draw();}
function overview(){focus=selected=hover=null;detail(null);refresh(true);}
canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};dragged=false;canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!pointer){const n=hit(e);hover=n?.id||null;canvas.style.cursor=n?'pointer':'grab';draw();return;}view.x+=e.clientX-pointer.x;view.y+=e.clientY-pointer.y;pointer.x=e.clientX;pointer.y=e.clientY;if(Math.hypot(e.clientX-pointer.sx,e.clientY-pointer.sy)>4)dragged=true;draw();});canvas.addEventListener('pointerup',e=>{if(!dragged){const n=hit(e);if(n)choose(n.id);}pointer=null;});canvas.addEventListener('pointercancel',()=>pointer=null);canvas.addEventListener('pointerleave',()=>{hover=null;draw();});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89);},{passive:false});canvas.addEventListener('dblclick',e=>{if(!hit(e))overview();});canvas.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoom(1.2);if(e.key==='-')zoom(.8);if(e.key==='Escape')overview();});
$('in').onclick=()=>zoom(1.2);$('out').onclick=()=>zoom(.8);$('fit').onclick=overview;$('back').onclick=overview;$('reset').onclick=()=>{for(const id of ['search','track','light'])$(id).value='';overview();};$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';draw();};function motionUI(){$('motion').textContent=motion?'暂停动态':'开启动效';$('motion').setAttribute('aria-pressed',String(motion));}$('motion').onclick=()=>{motion=!motion;motionUI();};reduced.addEventListener('change',e=>{if(e.matches){motion=false;motionUI();}});for(const id of ['search','track','light'])$(id).addEventListener(id==='search'?'input':'change',()=>{focus=selected=null;detail(null);refresh(true);});
function tick(t){requestAnimationFrame(tick);if(t-last<50)return;const dt=Math.min((t-last)/1000,.1);last=t;if(!motion||document.hidden||pointer||hover)return;phase+=dt*.028;for(const n of visible){const p=base.get(n.id);if(p.orbit&&positions.has(p.orbit)){const center=positions.get(p.orbit),a=p.angle+phase*(n.kind==='local'?.45:.25);positions.set(n.id,{x:center.x+Math.cos(a)*p.radius,y:center.y+Math.sin(a)*p.radius});}}draw();}
